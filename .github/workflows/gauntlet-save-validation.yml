name: Gauntlet Save Validation

on:
  push:
    branches: [gauntlet/save-validation]

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic integration
        run: node scripts/gauntlet-save-integration.mjs
      - run: npm ci
      - run: npm run audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/index.ts
          if git diff --cached --quiet; then
            echo "Integration already applied"
            exit 0
          fi
          git commit -m "feat: validate save data before restore"
          git push
