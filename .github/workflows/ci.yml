name: CI

on:
  push:
    branches: [master, main, gauntlet/dev-deps-audit]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile for dependency hardening
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - run: npm ci
      - name: Full dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run audit:runtime
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Persist validated lockfile
        if: github.ref == 'refs/heads/gauntlet/dev-deps-audit'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh audited dependency lockfile"
          git push
